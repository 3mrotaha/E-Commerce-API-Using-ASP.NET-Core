name: 'Get & Cache Dependencies'
description: 'Get the Dependencies using Nuget package and Cache them for next time, this needs the packages.lock.json to exist in each project'

inputs:
  cache-disable:
    description: 'Whether to cache deps or not'
    required: true
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: ${{ inputs.cache-disable != 'true' }}
        cache-dependency-path: "**/packages.lock.json"
    - name: Restore dependencies
      run: dotnet restore ./eCommerceSolution.slnx
      shell: bash
