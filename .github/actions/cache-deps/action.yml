name: 'Get & Cache Dependencies'
description: 'Get the Dependencies using Nuget package and Cache them for next time, this needs the packages.lock.json to exist in each project'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: true
        cache-dependency-path: "**/packages.lock.json"
    - name: Restore dependencies
      run: dotnet restore ./eCommerceSolution.slnx
      shell: bash
